<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="description" content="Let's Learn — concise programming notes and interview questions.">
    <title>Let's Learn | Programming Notes</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header class="top"><a class="brand" href="#home" id="brand"> <span class="logo">&lt;/&gt;</span> Let's
            <em>Learn</em></a>
        <nav id="subjects" aria-label="Subjects"></nav>
        <button id="accordion" class="setting" aria-pressed="false"
            title="Show only questions; click a question to reveal its answer"><span class="dot"></span>Collapse
            answers</button>
        <button id="theme" class="theme" aria-label="Toggle dark mode" title="Toggle dark mode">☾</button>
    </header>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidehead"><span id="sideTitle">Explore</span><span id="count"></span></div><input id="search"
                type="search" placeholder="Search topics..." aria-label="Search topics">
            <div id="topics" class="topics"></div>
        </aside>
        <main id="content" class="content" tabindex="-1" aria-live="polite"></main>
    </div>
    <footer>Made for curious minds · Let's Learn</footer>
    <script src="assets/js/app.js" defer></script>
</body>

</html>
